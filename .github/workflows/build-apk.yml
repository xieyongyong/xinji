name: 打包 APK

# 触发方式
#   1. 网页上手动点「Run workflow」（主要用法）
#   2. 往 main 分支推代码时自动打包（改文案、改逻辑后不用手动点）
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

# 创建 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 Android 安装包
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 版本写死，不要用 latest：
          #   Flutter 每个版本生成的 Android 模板（AGP / Gradle / Kotlin 版本）都不一样，
          #   跟仓库里的 app/build.gradle.kts 对不上就会编译失败。
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: 补齐 Android 工程骨架
        run: |
          echo "== 环境自检 =="
          flutter --version
          java -version
          echo ""
          echo "== 生成官方模板，只补本仓库没有的文件 =="
          # 为什么这么做：
          #   gradlew / gradle-wrapper.jar / res 图标 这些是二进制或版本敏感文件，
          #   手写容易和当前 Flutter 版本对不上。所以让 flutter 生成一份官方模板，
          #   再用 --ignore-existing 只补缺失文件，绝不覆盖仓库里已调好的配置
          #   （app/build.gradle.kts、AndroidManifest.xml、MainActivity.kt）。
          rm -rf /tmp/scaffold
          flutter create --platforms=android --org com.xinji --project-name payslip /tmp/scaffold
          rsync -a --ignore-existing /tmp/scaffold/android/ android/
          echo ""
          echo "== 确认关键配置没被覆盖 =="
          grep -n "minSdk" android/app/build.gradle.kts
          grep -n "FlutterFragmentActivity" android/app/src/main/kotlin/com/xinji/payslip/MainActivity.kt
          grep -n "USE_BIOMETRIC" android/app/src/main/AndroidManifest.xml
          ls -l android/app/keystore/xinji.jks

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: 跑核心算法测试
        run: flutter test
        continue-on-error: true

      - name: 编译 Release APK
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/xinji.apk
          ls -lh dist/

      - name: 上传构建产物（保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: xinji-apk-run${{ github.run_number }}
          path: dist/xinji.apk
          retention-days: 30

      - name: 发布到 Release（手机可直接下载）
        uses: softprops/action-gh-release@v2
        with:
          # 固定用 latest 这个 tag，于是下载地址永远不变：
          # https://github.com/<用户名>/<仓库名>/releases/latest/download/xinji.apk
          tag_name: latest
          name: 薪迹 · 最新安装包
          body: |
            自动构建，第 ${{ github.run_number }} 次。

            **手机直接下载这个链接（不用登录）：**
            https://github.com/${{ github.repository }}/releases/latest/download/xinji.apk

            版本：1.0.${{ github.run_number }}
            提交：${{ github.sha }}
            时间：${{ env.BUILD_TIME }}
          files: dist/xinji.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
