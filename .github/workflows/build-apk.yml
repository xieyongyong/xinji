name: 打包 APK

# 触发方式
#   1. 网页上手动点「Run workflow」（主要用法）
#   2. 往 main 分支推代码时自动打包（改文案、改逻辑后不用手动点）
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

# 创建 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 Android 安装包
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 版本写死，不要用 latest：
          #   Flutter 每个版本生成的 Android 模板（AGP / Gradle / Kotlin 版本）都不一样，
          #   跟仓库里的 app/build.gradle.kts 对不上就会编译失败。
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: 补齐 Android 工程骨架
        run: |
          echo "== 环境自检 =="
          flutter --version
          java -version
          echo ""
          echo "== 生成官方模板，只补本仓库没有的文件 =="
          # 为什么这么做：
          #   gradlew / gradle-wrapper.jar / res 图标 这些是二进制或版本敏感文件，
          #   手写容易和当前 Flutter 版本对不上。所以让 flutter 生成一份官方模板，
          #   再用 --ignore-existing 只补缺失文件，绝不覆盖仓库里已调好的配置
          #   （app/build.gradle.kts、AndroidManifest.xml、MainActivity.kt）。
          rm -rf /tmp/scaffold
          flutter create --platforms=android --org com.xinji --project-name payslip /tmp/scaffold
          rsync -a --ignore-existing /tmp/scaffold/android/ android/
          echo ""
          echo "== 确认关键配置没被覆盖 =="
          grep -n "minSdk" android/app/build.gradle.kts
          grep -n "FlutterFragmentActivity" android/app/src/main/kotlin/com/xinji/payslip/MainActivity.kt
          grep -n "USE_BIOMETRIC" android/app/src/main/AndroidManifest.xml
          ls -l android/app/keystore/xinji.jks

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: 跑核心算法测试
        run: flutter test
        continue-on-error: true

      - name: 读取版本号
        id: ver
        run: |
          # 版本以 pubspec.yaml 为准，不再用 1.0.<run_number> 覆盖：
          # 那样所有包都叫 1.0.x，既看不出是哪个版本，也没法在 Release 里区分。
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "VERSION=$V" >> $GITHUB_ENV
          echo "name=$V" >> $GITHUB_OUTPUT
          echo "本次版本：$V"

      - name: 编译 Release APK
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          # versionName 用 pubspec 里的版本（1.8.0），versionCode 用 run_number：
          # versionCode 必须单调递增，否则装不上新包。
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=$VERSION
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/xinji.apk
          # 校验文件：App 下载完用它核对 APK 完整性（防止第三方代理返回错误页/截断包）
          # 内容形如 "<64位哈希>  xinji.apk"，App 只取第一段哈希
          (cd dist && sha256sum xinji.apk > xinji.apk.sha256)
          echo "SHA256: $(cat dist/xinji.apk.sha256)"
          ls -lh dist/

      - name: 检查安装包内容（模型 / 原生库）
        run: |
          echo "APK 字节数: $(stat -c%s dist/xinji.apk)"
          echo "== assets/ppocr =="
          unzip -l dist/xinji.apk | grep -E "assets/ppocr" || echo "  （没有）"
          echo "== 各 ABI 的 so 合计 =="
          unzip -l dist/xinji.apk | grep -E "lib/[a-zA-Z0-9_-]+/.*\.so" \
            | awk '{split($4,p,"/"); s[p[2]]+=$1} END {for (k in s) printf "  %-14s %.1fMB\n", k, s[k]/1048576}' | sort
          echo "== onnxruntime / OpenCV =="
          unzip -l dist/xinji.apk | grep -E "libonnxruntime|libopencv_java" || echo "  （没有）"
          echo "== 库自带 v4 旧模型（应为空）=="
          unzip -l dist/xinji.apk | grep -E "ch_PP-OCRv4" || echo "  （已排除，好）"
          echo "== 32 位 armeabi-v7a（应为空）=="
          unzip -l dist/xinji.apk | grep -E "lib/armeabi-v7a/" || echo "  （已去掉，好）"

          # 模型没进包的话，装上就等于没有 PP-OCR，直接拦下来，别发出去
          if ! unzip -l dist/xinji.apk | grep -q "assets/ppocr/rec.onnx"; then
            echo "::error::PP-OCRv6 模型没打进 APK（assets/ppocr 缺失）"
            exit 1
          fi
          if ! unzip -l dist/xinji.apk | grep -q "assets/ppocr/dict.txt"; then
            echo "::error::PP-OCRv6 字典没打进 APK"
            exit 1
          fi
          if ! unzip -l dist/xinji.apk | grep -q "libonnxruntime4j_jni.so"; then
            echo "::error::onnxruntime 原生库没打进 APK"
            exit 1
          fi
          if ! unzip -l dist/xinji.apk | grep -q "libopencv_java"; then
            echo "::error::OpenCV 原生库没打进 APK（RapidOCR 依赖它做检测后处理）"
            exit 1
          fi

          # 瘦身校验：旧模型 / 32 位库如果又混进来，说明排除规则失效，拦下来不发。
          if unzip -l dist/xinji.apk | grep -q "ch_PP-OCRv4"; then
            echo "::error::RapidOCR 自带的 v4 旧模型没排除掉，白白多占 14MB，检查 ignoreAssetsPattern"
            exit 1
          fi
          if unzip -l dist/xinji.apk | grep -q "lib/armeabi-v7a/"; then
            echo "::error::32 位 armeabi-v7a 库没去掉，检查 abiFilters"
            exit 1
          fi

      - name: 上传构建产物（保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: xinji-apk-run${{ github.run_number }}
          path: dist/xinji.apk
          retention-days: 30

      - name: 发布本版本（永久保留，可回退下载）
        uses: softprops/action-gh-release@v2
        with:
          # 每个版本一个独立 tag，比如 v1.8.0。
          # 这样新版本出问题时，旧版本的安装包还在，能直接下回来装，
          # 不会被下一次构建覆盖掉。
          tag_name: v${{ env.VERSION }}
          name: 薪迹 v${{ env.VERSION }}
          body: |
            **版本 ${{ env.VERSION }}**（第 ${{ github.run_number }} 次构建）

            手机直接下载：
            https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/xinji.apk

            一直是最新版：
            https://github.com/${{ github.repository }}/releases/latest/download/xinji.apk

            提交：${{ github.sha }}
            时间：${{ env.BUILD_TIME }}

            > 这个包会一直留着。回退时先「设置 → 备份与恢复」导出备份，
            > 再卸载装旧版本（Android 不允许版本号倒退覆盖安装）。

            SHA-256 校验值见 xinji.apk.sha256，下载后可核对完整性。
          files: |
            dist/xinji.apk
            dist/xinji.apk.sha256
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 latest 快捷链接
        uses: softprops/action-gh-release@v2
        with:
          # tag 名固定叫 latest，于是 releases/download/latest/xinji.apk 永远可用。
          # 真正的版本归档在上面那个 step，这里只是一张"门牌"。
          tag_name: latest
          name: 薪迹 · 最新安装包
          body: |
            自动指向最新构建（当前版本 ${{ env.VERSION }}）。

            历史版本都在右侧 Releases 里，按 v1.x.x 命名。

            版本：${{ env.VERSION }}
            提交：${{ github.sha }}
            时间：${{ env.BUILD_TIME }}
          files: |
            dist/xinji.apk
            dist/xinji.apk.sha256
          overwrite_files: true
          make_latest: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
