name: xinji
description: 薪迹 · 本地工资条记录、归档与对比
publish_to: 'none'
version: 1.5.1+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 本地数据库
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # 状态管理
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # 离线 OCR（ML Kit 中文识别）
  # 注意：这里【故意】不依赖 google_mlkit_text_recognition 插件。
  #   插件会把 ML Kit 拽进主进程，一旦 native 崩了整个 App 就闪退。
  #   现在识别由 android/app/.../OcrService.kt 在 :ocr 独立进程里调用，
  #   ML Kit 的原生依赖写在 android/app/build.gradle.kts 的 dependencies 里。

  # 图片
  image_picker: ^1.1.2
  image: ^4.2.0

  # 安全
  local_auth: ^2.3.0
  crypto: ^3.0.3

  # 工具（图表用手写柱状图，少一个依赖少一个坑）
  intl: ^0.19.0

  # 备份
  archive: ^3.6.1
  encrypt: ^5.0.3
  share_plus: ^9.0.0
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
